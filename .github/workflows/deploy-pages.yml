name: Deploy review preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Download background template
        run: |
          curl --fail --location --retry 3 --output public/imaging/T1w_ICBM152_MNI2009bSym_0p5mm_display8bit.nii.gz \
            https://github.com/navonacalarco/claustrum-coordinates/releases/download/imaging-v1/T1w_ICBM152_MNI2009bSym_0p5mm_display8bit.nii.gz
          gzip -t public/imaging/T1w_ICBM152_MNI2009bSym_0p5mm_display8bit.nii.gz
      - run: node --test tests/*.test.mjs
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Check deployed imaging assets
        run: |
          for file in T1w_ICBM152_MNI2009bSym_0p5mm_display8bit claustrum_Calarco_MNI2009bSym_0p5mm claustrum_Mauri_MNI2009bSym_0p5mm insula_AllenAHRAv2_MNI2009bSym_0p5mm putamen_Xiao_MNI2009bSym_0p5mm amygdala_Xiao_MNI2009bSym_0p5mm; do
            test -s "dist/imaging/$file.nii.gz" || exit 1
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
